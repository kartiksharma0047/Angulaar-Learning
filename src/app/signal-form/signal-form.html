<div class="container mt-4">
  <h2 class="mb-1">Employee Registration</h2>
  <h6 class="mb-4 badge bg-success p-1">Signal Based</h6>
  <div class="row">
    <div class="col-md-4">
      <label class="form-label">Name
        @if(employeeForm.empName().required()){
          <span class="text-danger">*</span>
        }
      </label>
      <input
        type="text"
        [formField]="employeeForm.empName"
        class="form-control"
        placeholder="Enter Name"
      />
      @if (employeeForm.empName().touched()) {
        @for (item of employeeForm.empName().errors(); track $index) {
          <span class="requried">{{item.message}}</span>
        }
      }
    </div>
    <div class="col-md-4">
      <label class="form-label">City
        @if(employeeForm.empCity().required()){
          <span class="text-danger">*</span>
        }
      </label>
      <input
        type="text"
        [formField]="employeeForm.empCity"
        class="form-control"
        placeholder="Enter City"
      />
      @if (employeeForm.empCity().touched()) {
        @for (item of employeeForm.empCity().errors(); track $index) {
          <span class="requried">{{item.message}}</span>
        }
      }
    </div>
    <div class="col-md-4">
      <label class="form-label">State
        @if(employeeForm.empState().required()){
          <span class="text-danger">*</span>
        }
      </label>
      <input
        type="text"
        [formField]="employeeForm.empState"
        class="form-control"
        placeholder="Enter State"
      />
    </div>
  </div>
  <button class="btn btn-primary mt-4" (click)="saveEmp()">Submit</button>
</div>
